openapi: 3.0.0
info:
  title: Biblioteca API
  version: 1.0.0
  description: API RESTful para gerenciamento de biblioteca com categorias e livros

servers:
  - url: http://localhost:8082
    description: Servidor de desenvolvimento
  - url: http://localhost:8080
    description: Servidor alternativo

paths:
  /categoria:
    get:
      summary: Buscar todas as categorias
      operationId: buscarTodasCategorias
      tags:
        - Categoria
      responses:
        '200':
          description: Lista de categorias retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriaDto'
        '500':
          description: Erro interno do servidor

    post:
      summary: Criar nova categoria
      operationId: salvarCategoria
      tags:
        - Categoria
      requestBody:
        description: Dados da categoria a ser criada
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaDto'
      responses:
        '200':
          description: Categoria criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaDto'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '500':
          description: Erro interno do servidor

  /categoria/{id}:
    get:
      summary: Buscar categoria por ID
      operationId: buscarCategoriaPorId
      tags:
        - Categoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: ID da categoria
      responses:
        '200':
          description: Categoria encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaDto'
        '404':
          description: Categoria não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '500':
          description: Erro interno do servidor

    put:
      summary: Atualizar categoria
      operationId: atualizarCategoria
      tags:
        - Categoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: ID da categoria a atualizar
      requestBody:
        description: Dados atualizados da categoria
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaDto'
      responses:
        '200':
          description: Categoria atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaDto'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '404':
          description: Categoria não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '500':
          description: Erro interno do servidor

    delete:
      summary: Deletar categoria
      operationId: deletarCategoria
      tags:
        - Categoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: ID da categoria a deletar
      responses:
        '204':
          description: Categoria deletada com sucesso
        '404':
          description: Categoria não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '500':
          description: Erro interno do servidor

  /categoria/nomes/{nome}:
    get:
      summary: Buscar categorias por nome
      operationId: buscarCategoriaPorNome
      tags:
        - Categoria
      parameters:
        - name: nome
          in: path
          required: true
          schema:
            type: string
          description: Nome da categoria a buscar
      responses:
        '200':
          description: Categorias encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriaDto'
        '500':
          description: Erro interno do servidor

  /livro:
    get:
      summary: Buscar livros por categoria
      operationId: buscarLivrosPorCategoria
      tags:
        - Livro
      parameters:
        - name: categoria
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
          description: ID da categoria (0 para todos)
      responses:
        '200':
          description: Lista de livros retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LivroDto'
        '500':
          description: Erro interno do servidor

    post:
      summary: Criar novo livro
      operationId: salvarLivro
      tags:
        - Livro
      parameters:
        - name: categoria
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
          description: ID da categoria do livro
      requestBody:
        description: Dados do livro a ser criado
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LivroDto'
      responses:
        '200':
          description: Livro criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivroDto'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Categoria não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '500':
          description: Erro interno do servidor

  /livro/{id}:
    get:
      summary: Buscar livro por ID
      operationId: buscarLivroPorId
      tags:
        - Livro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: ID do livro
      responses:
        '200':
          description: Livro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivroDto'
        '404':
          description: Livro não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '500':
          description: Erro interno do servidor

    put:
      summary: Atualizar livro
      operationId: atualizarLivro
      tags:
        - Livro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: ID do livro a atualizar
        - name: categoria
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
          description: ID da categoria do livro
      requestBody:
        description: Dados atualizados do livro
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LivroDto'
      responses:
        '200':
          description: Livro atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivroDto'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Livro ou categoria não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '500':
          description: Erro interno do servidor

    delete:
      summary: Deletar livro
      operationId: deletarLivro
      tags:
        - Livro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: ID do livro a deletar
      responses:
        '204':
          description: Livro deletado com sucesso
        '404':
          description: Livro não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '500':
          description: Erro interno do servidor

components:
  schemas:
    CategoriaDto:
      type: object
      required:
        - nome
        - descricao
      properties:
        id:
          type: integer
          format: int32
          description: ID da categoria
          example: 1
        nome:
          type: string
          minLength: 3
          maxLength: 15
          description: Nome da categoria
          example: "Ficção Científica"
        descricao:
          type: string
          minLength: 10
          maxLength: 50
          description: Descrição da categoria
          example: "Livros de ficção científica e fantasia"

    LivroDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: ID do livro
          example: 1
        titulo:
          type: string
          description: Título do livro
          example: "Duna"
        autor:
          type: string
          description: Autor do livro
          example: "Frank Herbert"
        texto:
          type: string
          description: Texto ou resumo do livro
          example: "Uma épica de ficção científica ambientada em Arrakis"
        edicao:
          type: string
          enum:
            - PRIMEIRA
            - SEGUNDA
            - TERCEIRA
          description: Edição do livro
          example: "PRIMEIRA"
        categoria:
          $ref: '#/components/schemas/Categoria'

    Categoria:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        nome:
          type: string
          example: "Ficção Científica"
        descricao:
          type: string
          example: "Livros de ficção científica e fantasia"

    StandardError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Data e hora do erro
        status:
          type: integer
          format: int32
          description: Código HTTP do erro
          example: 404
        error:
          type: string
          description: Tipo do erro
          example: "Not Found"
        message:
          type: string
          description: Mensagem de erro
          example: "Categoria não encontrada"
        path:
          type: string
          description: Caminho da requisição
          example: "/categoria/999"

    ValidationErrors:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Data e hora do erro
        status:
          type: integer
          format: int32
          description: Código HTTP do erro
          example: 400
        error:
          type: string
          description: Tipo do erro
          example: "Validation Error"
        message:
          type: string
          description: Mensagem de erro
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrors'

    FieldErrors:
      type: object
      properties:
        field:
          type: string
          description: Campo que contém o erro
          example: "nome"
        message:
          type: string
          description: Mensagem de validação
          example: "O nome da categoria deve conter entre 3 e 15 caracteres"

